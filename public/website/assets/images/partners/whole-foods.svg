<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" aria-label="Whole Foods Market">
  <!-- Whole Foods Market Emblem & Wordmark -->
  <g fill="#005e38">
    <!-- Emblem Circle with leaf -->
    <circle cx="30" cy="30" r="24" fill="#005e38"/>
    <!-- Stylized Leaf Cutout / Accent -->
    <path d="M30 14 C38 20 42 32 30 46 C24 38 20 26 30 14 Z" fill="#ffffff"/>
    <path d="M30 22 C34 26 35 34 30 42" stroke="#005e38" stroke-width="2" stroke-linecap="round" fill="none"/>
    <circle cx="22" cy="24" r="3" fill="#ffffff"/>
    <!-- Typography: WHOLE FOODS MARKET -->
    <text x="66" y="27" font-family="'Manrope', 'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" letter-spacing="1.2" fill="#005e38">WHOLE FOODS</text>
    <text x="66" y="44" font-family="'Inter', Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="3.5" fill="#2d6a4f">M A R K E T</text>
  </g>
</svg>
